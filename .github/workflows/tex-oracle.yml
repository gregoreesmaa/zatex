# Pure-TeX geometry oracle (issue #178).
#
# INFORMATIONAL ONLY — this workflow is NEVER a required status check and
# NEVER blocks a merge. AGENTS.md section 4 bans pixel tests from required
# gates, and cross-font geometry comparison is approximate by
# construction (TeX sets Computer Modern, ZaTeX measures host fonts),
# so counts compare and metrics never do. Pinned KaTeX 0.18.7 remains
# the sole truth for accept/reject and geometry disputes: a MISMATCH
# means "ask why", never "change ZaTeX". Do NOT add this job to
# required status checks. See docs/tex-oracle.md.
name: tex-oracle

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      force_refresh:
        description: "Bypass the TeX-render cache (rebuild image, re-extract)"
        required: false
        default: "false"

jobs:
  geometry:
    runs-on: ubuntu-latest
    # Informational only: a TeX-side wobble or daemon hiccup must never
    # red a PR. The uploaded report + JSON sides carry the signal.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Parser selfcheck (no daemon, no TeX)
        run: python3 tools/tex-geometry/geometry.py --selfcheck

      # Stable-reference cache: the TeX side is keyed by every file
      # that can change it (corpus, driver, parser, Dockerfile). On a
      # hit the engines stay cold — existing renders are reused, never
      # re-rendered. The ZaTeX side below always runs fresh (the live
      # signal), and the diff always runs.
      - name: Restore TeX-side renders
        id: texcache
        uses: actions/cache/restore@v4
        with:
          path: /tmp/texgeo
          key: texgeo-${{ hashFiles('tools/tex-geometry/**') }}

      - name: Build irdump (ZaTeX construction counts)
        working-directory: packages/zatex
        run: zig build irdump

      - name: Dump the ZaTeX side of the narrow corpus
        run: |
          mkdir -p /tmp/texgeo
          python3 - <<'EOF'
          import json, subprocess
          corpus = json.load(open("tools/tex-geometry/corpus.json"))
          for row in corpus:
              cmd = ["packages/zatex/zig-out/bin/irdump"]
              if row["display"]:
                  cmd.append("--display")
              cmd.append(row["tex"])
              p = subprocess.run(cmd, capture_output=True, text=True)
              if p.returncode != 0:
                  print(f"== {row['id']}: irdump failed:\n{p.stderr}")
                  raise SystemExit(1)
              open(f"/tmp/texgeo/{row['id']}.zatex.json", "w").write(p.stderr)
              print(f"== {row['id']}: {p.stderr.strip()}")
          EOF

      # Raw ZaTeX renders for the pixel sim (always fresh: the live
      # side). zatex-png resolves the vendored Latin Modern fixture
      # from its package dir, like the screenshots job.
      - name: Build zatex-png and render the ZaTeX side
        working-directory: packages/zatex-png
        run: |
          zig build
          python3 - <<'EOF'
          import json, subprocess
          corpus = json.load(open("../../tools/tex-geometry/corpus.json"))
          for row in corpus:
              cmd = ["./zig-out/bin/zatex-png", "--px", "48"]
              if row["display"]:
                  cmd.append("--display")
              cmd += [row["tex"], f"/tmp/texgeo/{row['id']}.zatex.png"]
              p = subprocess.run(cmd, capture_output=True, text=True)
              if p.returncode != 0:
                  print(f"== {row['id']}: zatex-png failed:\n{p.stdout}\n{p.stderr}")
                  raise SystemExit(1)
              print(f"== {row['id']}: rendered")
          EOF

      - name: Build the TeX geometry image (reproducibility proof)
        if: steps.texcache.outputs.cache-hit != 'true' || github.event.inputs.force_refresh == 'true'
        run: docker build -t zatex-tex-geometry:1.0.0 tools/tex-geometry

      - name: Extract the TeX side of the narrow corpus
        id: extract
        if: steps.texcache.outputs.cache-hit != 'true' || github.event.inputs.force_refresh == 'true'
        run: |
          python3 - <<'EOF'
          import json, subprocess
          corpus = json.load(open("tools/tex-geometry/corpus.json"))
          tsv = []
          for row in corpus:
              open(f"/tmp/texgeo/{row['id']}.tex", "w").write(row["tex"])
              tsv.append(f"{row['id']} {1 if row['display'] else 0}")
          open("/tmp/texgeo/cases.tsv", "w").write("\n".join(tsv) + "\n")
          EOF
          docker run --rm --network none \
            -v /tmp/texgeo:/work \
            zatex-tex-geometry:1.0.0 batch /work
          for f in /tmp/texgeo/*.tex.json; do echo "== $f"; cat "$f"; done

      # Save fresh renders for later runs (skipped on a hit, and on
      # any failure so a partial row can never poison the cache).
      - name: Save TeX-side renders
        if: success() && (steps.texcache.outputs.cache-hit != 'true' || github.event.inputs.force_refresh == 'true')
        uses: actions/cache/save@v4
        with:
          path: /tmp/texgeo
          key: texgeo-${{ hashFiles('tools/tex-geometry/**') }}

      # TeX pixel sims through the shared normalize+SSIM math
      # (report.py); needs no daemon. Normalized TeX renders land in
      # /tmp/texgeo/norm for the committed report.
      - name: Score ZaTeX-vs-TeX pixels (shared oracle math)
        run: python3 tools/tex-geometry/tex_score.py tools/tex-geometry/corpus.json /tmp/texgeo

      - name: Diff construction counts (report only, never fails)
        run: python3 tools/tex-geometry/diff_geometry.py tools/tex-geometry/corpus.json /tmp/texgeo /tmp/texgeo/report.md

      - name: Upload geometry report + both JSON sides
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tex-oracle
          path: /tmp/texgeo
          retention-days: 14
