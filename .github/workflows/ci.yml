name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Run all tests (full profile, incl. pinned-KaTeX sweep)
        run: zig build test --summary all
      - name: Subset-profile size gate (no host-cost growth)
        run: tools/size_gate.sh

  sweep-freshness:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/katex/package-lock.json
      - name: Regenerate pinned-KaTeX goldens and fail on drift
        run: |
          cd tools/katex
          npm ci
          npm run sweep
          git diff --exit-code ../../goldens/katex_sweep.json

  # Visual regression: re-render every checked-in PNG and fail on any
  # pixel drift, so each PR carries eyeballable screenshots. Renders are
  # byte-deterministic for fixed input + fixture font on one runner
  # image (pinned macos-14 below); the fresh PNGs also upload as
  # artifacts for comparison under the PR.
  screenshots:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Re-render screenshot baselines and fail on drift
        run: |
          ./zatex-png/screenshots/render.sh /tmp/shots
          diff -rq zatex-png/screenshots/png /tmp/shots
      - name: Regenerate docs mirror and fail on drift
        run: |
          python3 tools/gen_doc_renders.py
          git diff --exit-code docs/ zatex-png/screenshots/png
      - name: Attach renders to the run
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: renders
          path: |
            /tmp/shots
            docs/renders
          retention-days: 14
