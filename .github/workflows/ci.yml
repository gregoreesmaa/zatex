name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Run core tests (incl. pinned-KaTeX sweep)
        working-directory: packages/zatex
        run: zig build test --summary all
      - name: Run zatex-mathml tests
        working-directory: packages/zatex-mathml
        run: zig build test --summary all
      - name: Run zatex-svg tests
        working-directory: packages/zatex-svg
        run: zig build test --summary all
      - name: Run zatex-png tests
        working-directory: packages/zatex-png
        run: zig build test --summary all
      - name: Every png source test executes (issue #106)
        run: tools/check_test_roots.sh
      - name: Distribution size gate (no artifact growth)
        run: tools/size_gate.sh

  # Host-facing tooling (issues #252/#256/#257/#258/#264/#274):
  # the C example builds and runs, the inspector dumps real
  # geometry, the test double answers its scripts, and the
  # render-parity kit re-renders drift-free. The delimiter vectors
  # (#252) and bridge tests (#256) ride in `zig build test` above.
  host-tooling:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: C example host builds and runs (issue #257)
        working-directory: packages/zatex
        run: |
          zig build hello
          ./zig-out/bin/hello-formula | tee /tmp/hello.txt
          grep -q "^provider: .* conform diagnostics: " /tmp/hello.txt
          grep -q "^extents: width=" /tmp/hello.txt
          grep -q "^run 0:" /tmp/hello.txt
          grep -q "^rule 0:" /tmp/hello.txt
      - name: Layout inspector dumps real geometry (issue #264)
        working-directory: packages/zatex
        run: |
          zig build inspect
          ./zig-out/bin/inspect "x^2+\\frac12" | python3 -c "import json,sys; d=json.load(sys.stdin); assert d['width'] > 0 and len(d['runs']) > 0 and len(d['rules']) > 0"
          if ./zig-out/bin/inspect '\foo'; then echo "inspect must fail on invalid TeX"; exit 1; fi
      - name: Host render-parity kit is drift-free (issue #258)
        run: ./tools/host-parity/check.sh /tmp/kit-ci
      - name: Scripted test double builds and answers (issue #274)
        working-directory: packages/zatex
        run: |
          zig build test-double
          ls zig-out/test-double/
          python3 ../../tools/test-double/check.py

  # Release-docs agreement (issues #275/#276): the release workflow,
  # the install recipe, the changelog, and the package version never
  # contradict each other again (closed #259 vs no-assets-yet,
  # zatex_version() field widths). Pure shell, no toolchain needed.
  release-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Workflow, recipe, changelog, and versions agree
        run: ./tools/check_release_docs.sh

  sweep-freshness:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/katex/package-lock.json
      - name: Regenerate pinned-KaTeX goldens and fail on drift
        run: |
          cd tools/katex
          npm ci
          npm run sweep
          git diff --exit-code ../../packages/zatex/goldens/katex_sweep.json
      - name: Regenerate delimiter vectors and fail on drift (issue #252)
        run: |
          cd tools/katex
          npm run delim-vectors
          git diff --exit-code ../../packages/zatex/goldens/delimiter_vectors.json

  # Doc-mirror freshness (issue #91): the syntax mirror is generated
  # from docs/support-table.md — re-resolve examples and fail on drift
  # so uncovered rows, tier changes, and pipe-table regressions are
  # caught at generation time. Scoped to the mirror markdown (never
  # render bytes: those stay rasterizer-sensitive per AGENTS.md §4).
  mirror-freshness:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Build zatex-png
        working-directory: packages/zatex-png
        run: zig build
      - name: Regenerate mirror and fail on drift
        run: |
          python3 tools/gen_doc_renders.py
          git diff --exit-code docs/katex-syntax.md

  # Informational eyeball aid, NEVER a required gate (AGENTS.md §4,
  # issue #13): renders the fixed corpus at PR head and base, uploads
  # both galleries as artifacts, and posts the changed-row summary as a
  # PR comment. `continue-on-error` keeps this from ever blocking a
  # merge; do NOT add this job to required status checks.
  gallery:
    runs-on: macos-14
    continue-on-error: true
    permissions:
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Render gallery at head
        working-directory: packages/zatex
        run: |
          zig build gallery
          ./zig-out/bin/gallery 2> "$GITHUB_WORKSPACE/gallery-head.html"
      - name: Render gallery at base
        run: |
          base="${{ github.event.pull_request.base.sha || github.sha }}"
          git worktree add /tmp/zatex-base "$base"
          if [ -f /tmp/zatex-base/packages/zatex/build.zig ]; then
            cd /tmp/zatex-base/packages/zatex
          else
            cd /tmp/zatex-base
          fi
          if zig build gallery 2>/dev/null && ./zig-out/bin/gallery 2> "$GITHUB_WORKSPACE/gallery-base.html"; then
            echo "base gallery rendered"
          else
            # Bootstrap: the gallery tool postdates the base commit (i.e.
            # this very PR introduces it), so there is no base gallery to
            # diff against — the diff then lists every row as ADDED.
            printf '<!DOCTYPE html><html><body><p>No base gallery: the gallery tool postdates the base commit.</p></body></html>\n' > "$GITHUB_WORKSPACE/gallery-base.html"
          fi
      - name: Diff galleries
        run: |
          python3 tools/gallery_diff.py gallery-base.html gallery-head.html | tee gallery-diff.txt
          cat gallery-diff.txt >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: gallery
          path: |
            gallery-head.html
            gallery-base.html
            gallery-diff.txt
      - name: Comment summary on PR
        if: github.event_name == 'pull_request'
        run: gh pr comment "${{ github.event.pull_request.number }}" --body-file gallery-diff.txt || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Portability matrix (issue #50): every backend builds, the software
  # backend's own suite runs under both selections, and the software
  # rasterizer re-renders the corpus dimension-identical to CoreGraphics
  # (layout determinism — dimensions, never pixels, per AGENTS.md §4).
  # iOS/Android full links need SDK/NDK runners (see
  # packages/zatex-png/README.md); here their backend files at least
  # compile-check.
  backends:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Backend suites (CoreGraphics and software selections)
        working-directory: packages/zatex-png
        run: |
          zig build test --summary all
          zig build -Dbackend=software test --summary all
      - name: Cross-compile all backends
        working-directory: packages/zatex-png
        run: |
          zig build -Dtarget=x86_64-linux
          zig build -Dtarget=aarch64-linux
          zig build -Dtarget=x86_64-windows
          zig build -Dtarget=x86_64-linux -Dbackend=native
          zig build -Dtarget=x86_64-windows -Dbackend=native
      - name: Per-OS backend isolation (no foreign text-stack symbols)
        run: tools/check_backends.sh
      - name: iOS/Android backend files compile-check (SDK/NDK link on device runners)
        working-directory: packages/zatex-png
        run: |
          zig build-obj src/ios_backend.zig -target aarch64-macos -O Debug --cache-dir /tmp/zig-objcache
          zig build-obj src/android_backend.zig -target aarch64-linux -O Debug --cache-dir /tmp/zig-objcache
      - name: Software-vs-CoreGraphics dimension equality (same tree)
        working-directory: packages/zatex-png
        run: |
          ./screenshots/render.sh /tmp/shots-cg
          zig build -Dbackend=software
          ./zig-out/bin/zatex-png --corpus screenshots/corpus.json --outdir /tmp/shots-sw --px 48
          python3 ../../tools/dim_equal.py /tmp/shots-cg /tmp/shots-sw

  # Native Linux proof (issue #50): the software backend is the default
  # there, so this builds, tests, and renders natively — a working
  # binary, not just a cross-link. Pixel baselines stay macOS-scoped
  # (compare_shots.py is calibrated same-rasterizer), so Linux asserts
  # run-success plus dimension determinism, never pixels.
  linux-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Build, test, and render natively on Linux
        working-directory: packages/zatex-png
        run: |
          zig build test --summary all
          zig build
          ./zig-out/bin/zatex-png "x^2" /tmp/smoke.png
          ./zig-out/bin/zatex-png --corpus screenshots/corpus.json --outdir /tmp/shots-linux --px 48
      - name: Native backend suite on Linux (fontconfig/FreeType, issue #65)
        working-directory: packages/zatex-png
        run: |
          zig build -Dbackend=native test --summary all
          zig build -Dbackend=native
          ./zig-out/bin/zatex-png "x^2" /tmp/smoke-native.png
          ./zig-out/bin/zatex-png --corpus screenshots/corpus.json --outdir /tmp/shots-linux-native --px 48

  # Visual regression: re-render every checked-in PNG and fail on real
  # pixel drift, so each PR carries eyeballable screenshots. Layout is
  # deterministic (dimensions must match exactly), but CoreText
  # antialiasing coverage varies by a few levels across macOS builds,
  # so tools/compare_shots.py compares decoded pixels with calibrated
  # tolerances instead of bytes. Fresh PNGs also upload as artifacts
  # for comparison under the PR.
  # NOTE: informational only, not a required gate (per AGENTS.md §4,
  # required gates compare IR/MathML text, never rendered pixels).
  screenshots:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Re-render screenshot baselines and fail on drift
        run: |
          ./packages/zatex-png/screenshots/render.sh /tmp/shots
          python3 tools/compare_shots.py packages/zatex-png/screenshots/png /tmp/shots
      - name: Regenerate docs mirror and fail on drift
        run: |
          cp -r docs/renders /tmp/docbase
          python3 tools/gen_doc_renders.py
          python3 tools/compare_shots.py /tmp/docbase docs/renders
          git diff --exit-code docs/katex-syntax.md
      - name: Attach renders to the run
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: renders
          path: |
            /tmp/shots
            docs/renders
          retention-days: 14
