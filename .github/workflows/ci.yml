name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Run all tests (full profile, incl. pinned-KaTeX sweep)
        run: zig build test --summary all
      - name: Subset-profile size gate (no host-cost growth)
        run: tools/size_gate.sh

  sweep-freshness:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/katex/package-lock.json
      - name: Regenerate pinned-KaTeX goldens and fail on drift
        run: |
          cd tools/katex
          npm ci
          npm run sweep
          git diff --exit-code ../../goldens/katex_sweep.json
